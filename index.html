    /* ================================

    function IntroSplash() {
      const [visible, setVisible] = useState(() => { try { return sessionStorage.getItem('og-intro-seen') !== '1'; } catch { return true; } });

    /* ================================
       STARFIELD
       ================================ */
    function Starfield({ density = 220 }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current; if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let stars = [];
        const shootingRef = { current: [] };
        const resize = () => {
          canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
          ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr, dpr);
          const w = window.innerWidth, h = window.innerHeight;
          stars = Array.from({length:density}, () => ({ x: Math.random()*w, y: Math.random()*h, z: Math.random()*0.7+0.3, r: Math.random()*1.3+0.2, tw: Math.random()*Math.PI*2, speed: Math.random()*0.04+0.005 }));
        };
        resize(); window.addEventListener('resize', resize);
        let raf;
        const tick = () => {
          const w = window.innerWidth, h = window.innerHeight;
          ctx.clearRect(0,0,w,h);
          for (const s of stars) {
            s.tw += 0.03 * s.speed * 8;
            const a = (Math.sin(s.tw)+1)/2;
            const r = s.r * (0.5 + a*0.7);
            ctx.fillStyle = `rgba(230,230,255,${0.4+a*0.6})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.fill();
            s.x -= s.speed * 0.2; if (s.x < -2) s.x = w+2;
          }
          if (Math.random() < 0.005 && shootingRef.current.length < 3) {
            shootingRef.current.push({ x: Math.random()*w, y: Math.random()*h*0.4, vx: 6+Math.random()*4, vy: 2+Math.random()*2, life: 1 });
          }
          shootingRef.current = shootingRef.current.filter((sh) => {
            sh.x += sh.vx; sh.y += sh.vy; sh.life -= 0.012;
            const g = ctx.createLinearGradient(sh.x-sh.vx*6, sh.y-sh.vy*6, sh.x, sh.y);
            g.addColorStop(0,'rgba(255,200,130,0)'); g.addColorStop(1,`rgba(255,200,130,${sh.life})`);
            ctx.strokeStyle = g; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(sh.x-sh.vx*6, sh.y-sh.vy*6); ctx.lineTo(sh.x, sh.y); ctx.stroke();
            return sh.life > 0;
          });
          raf = requestAnimationFrame(tick);
        };

          h('div', { style: { display: 'flex', gap: '0.5rem', flexWrap: 'wrap', marginBottom: '2rem' } },
            tracks.map(t => {

                h('div', { style: { position: 'absolute', top: 0, left: 0, right: 0, height: 2, background: isO ? 'linear-gradient(90deg, var(--orange), var(--cyan))' : 'linear-gradient(90deg, transparent, var(--orange), transparent)' } }),

                  h('span', { style: { color: 'var(--text-mute)' } }, '·'),

          )

      );
    }

              h('div', { className: 'font-mono', style: { fontSize: '0.7rem', color: 'var(--text-mute)', letterSpacing: '0.2em', marginBottom: '0.6rem' } }, 'COORDINATOR'),

          h('div', { className: 'divider', style: { marginTop: '2rem', marginBottom: '1rem' } }),

    /* ================================

       ================================ */
    function Shell() {
      const location = useLocation();
      useEffect(() => { window.scrollTo(0, 0); }, [location.pathname]);
      return h('div', { className: 'app-shell' },
        h(IntroSplash),
        h(Starfield, { density: 220 }),
        h('div', { className: 'grid-overlay' }),
        h('div', { className: 'scanline' }),
        h('div', { className: 'vignette' }),
        h(Navbar),
        h(SocialSidebar),
        h('main', null,
          h(Routes, null,
            h(Route, { path: '*', element: h(React.Fragment, null, h(Hero), h(About), h(Details), h(ProblemSection), h(DatasetsSection), h(Timeline), h(Contact), h(Footer)) })
          )
        ),
        h(SandCursor)

    }

    createRoot(document.getElementById('root')).render(
      h(React.StrictMode, null,
